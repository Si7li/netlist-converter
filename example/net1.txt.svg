<?xml version="1.0"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    xmlns:ev="http://www.w3.org/2001/xml-events"
    version="1.1"
    baseProfile="full"
    viewBox="20 20 600 200">
    <style>
        .vert { font-size: 16; fill: #000000; dominant-baseline: middle }
        .hori { font-size: 16; fill: #000000; text-anchor: middle }
        /* Semantic layer styles */
        .component { }
        .transistor { }
        .passive { }
        .source { }
        .net { stroke: #000000; fill: none; stroke-linejoin: round; stroke-linecap: round; }
        .net-power { stroke: #000000; stroke-width: 2; stroke-linejoin: round; }
        .net-ground { stroke: #000000; stroke-width: 2; stroke-linejoin: round; }
        .net-signal { stroke: #000000; stroke-width: 1.5; stroke-linejoin: round; }
        .junction { fill: #000000; }
        .bridge { stroke: #888888; stroke-width: 1; fill: none; }
    </style>
    <defs>
        <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto">
        <polygon points="0 0, 4 4, 0 8" />
        </marker>
    </defs>
    <g>
        <rect x="20" y="20" width="600" height="200" style="fill:#ffffff" />
    </g>
    <g class="components transistors" data-layer="transistors">
    </g>
    <g class="nets" data-layer="wires">
        <g class="net net-ground" data-from="0" data-to="V1">
            <title>0 → V1</title>
            <path d="M 560 160 L 560 120" />
        </g>
        <g class="net net-signal" data-from="n8" data-to="V1">
            <title>n8 → V1</title>
            <path d="M 560 80 L 560 120" />
        </g>
        <g class="net net-signal" data-from="R1" data-to="r">
            <title>R1 → r</title>
            <path d="M 400 80 L 480 80" />
        </g>
        <g class="net net-signal" data-from="C1" data-to="c">
            <title>C1 → c</title>
            <path d="M 160 80 L 240 80" />
        </g>
        <g class="net net-signal" data-from="l" data-to="C1">
            <title>l → C1</title>
            <path d="M 80 80 L 160 80" />
        </g>
        <g class="net net-signal" data-from="n8" data-to="r">
            <title>n8 → r</title>
            <path d="M 560 80 L 480 80" />
        </g>
        <g class="net net-signal" data-from="n9" data-to="l">
            <title>n9 → l</title>
            <path d="M 80 160 L 80 80" />
        </g>
        <g class="net net-signal" data-from="c" data-to="R1">
            <title>c → R1</title>
            <path d="M 240 80 L 400 80" />
        </g>
        <g class="net net-ground" data-from="L1" data-to="0">
            <title>L1 → 0</title>
            <path d="M 320 160 L 560 160" />
        </g>
        <g class="net net-signal" data-from="n9" data-to="L1">
            <title>n9 → L1</title>
            <path d="M 80 160 L 320 160" />
        </g>
    </g>
    <g class="components other" data-layer="components">
    <g>
        <circle cx="560" cy="120" r="18" style="fill:#ffffff;stroke:#000000;stroke-width:1" />
        <circle cx="560" cy="120" r="0" style="fill:#ffffff;stroke:#000000;stroke-width:1" />
        <line x1="560" y1="128" x2="560" y2="112" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)" />
        <text x="583" y="120" class="vert">V1</text>
        <text x="583" y="136" class="vert">1</text>
    </g>
    <g>
        <path d="M 560,160 h 20 v 20" style="fill:#ffffff;stroke:#000000;stroke-width:1" />
        <path d="M 580,180 h 10 l -10,10 l -10,-10 h 10" style="fill:#000000;stroke:#000000;stroke-width:1" />
    </g>
    <g class="junction">
        <circle cx="560" cy="160" r="4" style="fill:#000000" />
    </g>
    <g>
        <rect x="380" y="70" width="40" height="20" style="fill:#ffffff;stroke:#000000;stroke-width:1" />
        <text x="400" y="65" class="hori">R1</text>
        <text x="400" y="111" class="hori">10k</text>
    </g>
    <g>
        <rect x="155" y="70" width="10" height="20" style="fill:#ffffff" />
        <line x1="155" y1="70" x2="155" y2="90" stroke="#000000" stroke-width="1" />
        <line x1="165" y1="70" x2="165" y2="90" stroke="#000000" stroke-width="1" />
        <text x="160" y="65" class="hori">C1</text>
        <text x="160" y="111" class="hori">10n</text>
    </g>
    <g>
        <rect x="302" y="156" width="36" height="12" style="fill:#ffffff" />
        <path d="M 302,160 C 306,168 310,168 314,160 C 318,168 322,168 326,160 C 330,168 334,168 338,160 " style="fill:#ffffff;stroke:#000000;stroke-width:1" />
        <text x="320" y="155" class="hori">L1</text>
        <text x="320" y="181" class="hori">5.3</text>
    </g>
    </g>
</svg>