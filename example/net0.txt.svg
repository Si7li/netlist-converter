<?xml version="1.0"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    xmlns:ev="http://www.w3.org/2001/xml-events"
    version="1.1"
    baseProfile="full"
    viewBox="20 20 200 200">
    <style>
        .vert { font-size: 16; fill: #000000; dominant-baseline: middle }
        .hori { font-size: 16; fill: #000000; text-anchor: middle }
        /* Semantic layer styles */
        .component { }
        .transistor { }
        .passive { }
        .source { }
        .net { stroke: #000000; fill: none; stroke-linejoin: round; stroke-linecap: round; }
        .net-power { stroke: #000000; stroke-width: 2; stroke-linejoin: round; }
        .net-ground { stroke: #000000; stroke-width: 2; stroke-linejoin: round; }
        .net-signal { stroke: #000000; stroke-width: 1.5; stroke-linejoin: round; }
        .junction { fill: #000000; }
        .bridge { stroke: #888888; stroke-width: 1; fill: none; }
    </style>
    <defs>
        <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto">
        <polygon points="0 0, 4 4, 0 8" />
        </marker>
    </defs>
    <g>
        <rect x="20" y="20" width="200" height="200" style="fill:#ffffff" />
    </g>
    <g class="components transistors" data-layer="transistors">
    </g>
    <g class="nets" data-layer="wires">
        <g class="net net-ground" data-from="0" data-to="V1">
            <title>0 → V1</title>
            <path d="M 160 160 L 160 120" />
        </g>
        <g class="net net-power" data-from="R1" data-to="vdd">
            <title>R1 → vdd</title>
            <path d="M 80 120 L 80 80" />
        </g>
        <g class="net net-signal" data-from="n4" data-to="V1">
            <title>n4 → V1</title>
            <path d="M 160 80 L 160 120" />
        </g>
        <g class="net net-signal" data-from="n5" data-to="R1">
            <title>n5 → R1</title>
            <path d="M 80 160 L 80 120" />
        </g>
        <g class="net net-power" data-from="n4" data-to="vdd">
            <title>n4 → vdd</title>
            <path d="M 160 80 L 80 80" />
        </g>
        <g class="net net-ground" data-from="n5" data-to="0">
            <title>n5 → 0</title>
            <path d="M 80 160 L 160 160" />
        </g>
    </g>
    <g class="components other" data-layer="components">
    <g>
        <circle cx="160" cy="120" r="18" style="fill:#ffffff;stroke:#000000;stroke-width:1" />
        <circle cx="160" cy="120" r="0" style="fill:#ffffff;stroke:#000000;stroke-width:1" />
        <line x1="160" y1="128" x2="160" y2="112" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)" />
        <text x="183" y="120" class="vert">V1</text>
        <text x="183" y="136" class="vert">1</text>
    </g>
    <g>
        <path d="M 160,160 h 20 v 20" style="fill:#ffffff;stroke:#000000;stroke-width:1" />
        <path d="M 180,180 h 10 l -10,10 l -10,-10 h 10" style="fill:#000000;stroke:#000000;stroke-width:1" />
    </g>
    <g class="junction">
        <circle cx="160" cy="160" r="4" style="fill:#000000" />
    </g>
    <g>
        <rect x="70" y="100" width="20" height="40" style="fill:#ffffff;stroke:#000000;stroke-width:1" />
        <text x="95" y="120" class="vert">R1</text>
        <text x="95" y="136" class="vert">10k</text>
    </g>
    </g>
</svg>