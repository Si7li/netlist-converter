<?xml version="1.0"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    xmlns:ev="http://www.w3.org/2001/xml-events"
    version="1.1"
    baseProfile="full"
    viewBox="20 20 280 280">
    <style>
        .vert { font-size: 16; fill: #000000; dominant-baseline: middle }
        .hori { font-size: 16; fill: #000000; text-anchor: middle }
        /* Semantic layer styles */
        .component { }
        .transistor { }
        .passive { }
        .source { }
        .net { stroke: #000000; fill: none; stroke-linejoin: round; stroke-linecap: round; }
        .net-power { stroke: #000000; stroke-width: 2; stroke-linejoin: round; }
        .net-ground { stroke: #000000; stroke-width: 2; stroke-linejoin: round; }
        .net-signal { stroke: #000000; stroke-width: 1.5; stroke-linejoin: round; }
        .junction { fill: #000000; }
        .bridge { stroke: #888888; stroke-width: 1; fill: none; }
    </style>
    <defs>
        <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto">
        <polygon points="0 0, 4 4, 0 8" />
        </marker>
    </defs>
    <g>
        <rect x="20" y="20" width="280" height="280" style="fill:#ffffff" />
    </g>
    <g class="components transistors" data-layer="transistors">
    </g>
    <g class="nets" data-layer="wires">
        <g class="net net-signal" data-from="C1" data-to="2">
            <title>C1 → 2</title>
            <path d="M 160 200 L 160 240" />
        </g>
        <g class="net net-ground" data-from="L1" data-to="0">
            <title>L1 → 0</title>
            <path d="M 240 200 L 240 160" />
        </g>
        <g class="net net-signal" data-from="n9" data-to="C1">
            <title>n9 → C1</title>
            <path d="M 160 160 L 160 200" />
        </g>
        <g class="net net-signal" data-from="n10" data-to="L1">
            <title>n10 → L1</title>
            <path d="M 240 240 L 240 200" />
        </g>
        <g class="net net-signal" data-from="3" data-to="V1">
            <title>3 → V1</title>
            <path d="M 80 80 L 160 80" />
        </g>
        <g class="net net-signal" data-from="R1" data-to="3">
            <title>R1 → 3</title>
            <path d="M 80 160 L 80 80" />
        </g>
        <g class="net net-signal" data-from="n7" data-to="V1">
            <title>n7 → V1</title>
            <path d="M 240 80 L 160 80" />
        </g>
        <g class="net net-ground" data-from="n7" data-to="0">
            <title>n7 → 0</title>
            <path d="M 240 80 L 240 160" />
        </g>
        <g class="net net-signal" data-from="n8" data-to="R1">
            <title>n8 → R1</title>
            <path d="M 80 240 L 80 160" />
        </g>
        <g class="net net-signal" data-from="n8" data-to="2">
            <title>n8 → 2</title>
            <path d="M 80 240 L 160 240" />
        </g>
        <g class="net net-ground" data-from="n9" data-to="0">
            <title>n9 → 0</title>
            <path d="M 160 160 L 240 160" />
        </g>
        <g class="net net-signal" data-from="n10" data-to="2">
            <title>n10 → 2</title>
            <path d="M 240 240 L 160 240" />
        </g>
        <circle class="junction" cx="160" cy="240" r="4" />
    </g>
    <g class="components other" data-layer="components">
    <g>
        <circle cx="160" cy="80" r="18" style="fill:#ffffff;stroke:#000000;stroke-width:1" />
        <circle cx="160" cy="80" r="0" style="fill:#ffffff;stroke:#000000;stroke-width:1" />
        <line x1="168" y1="80" x2="152" y2="80" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)" />
        <text x="160" y="57" class="hori">V1</text>
        <text x="160" y="114" class="hori">DC</text>
    </g>
    <g>
        <path d="M 240,160 h 20 v 20" style="fill:#ffffff;stroke:#000000;stroke-width:1" />
        <path d="M 260,180 h 10 l -10,10 l -10,-10 h 10" style="fill:#000000;stroke:#000000;stroke-width:1" />
    </g>
    <g class="junction">
        <circle cx="240" cy="160" r="4" style="fill:#000000" />
    </g>
    <g>
        <rect x="70" y="140" width="20" height="40" style="fill:#ffffff;stroke:#000000;stroke-width:1" />
        <text x="95" y="160" class="vert">R1</text>
        <text x="95" y="176" class="vert">1k</text>
    </g>
    <g class="junction">
        <circle cx="160" cy="240" r="4" style="fill:#000000" />
    </g>
    <g>
        <rect x="150" y="195" width="20" height="10" style="fill:#ffffff" />
        <line x1="150" y1="195" x2="170" y2="195" stroke="#000000" stroke-width="1" />
        <line x1="150" y1="205" x2="170" y2="205" stroke="#000000" stroke-width="1" />
        <text x="175" y="200" class="vert">C1</text>
        <text x="175" y="216" class="vert">1u</text>
    </g>
    <g>
        <rect x="236" y="182" width="12" height="36" style="fill:#ffffff" />
        <path d="M 240,182 C 248,186 248,190 240,194 C 248,198 248,202 240,206 C 248,210 248,214 240,218 " style="fill:#ffffff;stroke:#000000;stroke-width:1" />
        <text x="253" y="200" class="vert">L1</text>
        <text x="253" y="216" class="vert">1m</text>
    </g>
    </g>
</svg>